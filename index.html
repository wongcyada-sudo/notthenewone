<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>夢女與夢角 · 字卡傳訊</title>
<style>
:root{
  --bg:#f1f4f0;--panel:#ffffff;--text:#2f332f;--text-sub:#8f968f;
  --user-bubble:#95ec69;--user-text:#1f2a1a;--dream-bubble:#ffffff;--dream-text:#2f332f;
  --btn:#4f9a4f;--btn-text:#fff;--input-bg:#eef1ed;--input-text:#2f332f;
  --avatar-border:#dfe4dd;--typing-bg:#eef1ed;--typing-text:#8f968f;
  --nav-bg:#f7faf6;--divider:#e4e9e2;--accent:#4f9a4f;
  --tarot-bg:#e9efe6;--tarot-card:#ffffff;--tarot-accent:#4f9a4f;--tarot-gold:#c9a35c;--tarot-text:#2f332f;
  --app-font:system-ui,-apple-system,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--app-font);
  background:var(--bg);color:var(--text);overscroll-behavior:none;
  font-size:15px;line-height:1.45;
}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;padding-top:var(--safe-t);padding-bottom:var(--safe-b);}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;touch-action:manipulation;}
input,textarea{font-family:inherit;font-size:16px;touch-action:manipulation;}
input:focus,textarea:focus{outline:none;}
.hidden{display:none!important;}

/* ===== 导航栏 ===== */
#nav{
  height:56px;min-height:56px;display:flex;align-items:center;gap:8px;padding:0 12px;
  background:var(--nav-bg);border-bottom:1px solid var(--divider);z-index:20;
}
#nav .nav-back{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0;}
#nav .nav-back:active{background:var(--input-bg);}
#nav .nav-title{font-size:17px;font-weight:600;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#nav .nav-account{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-sub);max-width:90px;}
#nav .nav-account span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#nav .dot{width:8px;height:8px;border-radius:50%;background:#6fbf73;flex-shrink:0;}

/* ===== 页面容器 ===== */
.page{flex:1;overflow:hidden;display:none;flex-direction:column;position:relative;}
.page.active{display:flex;}

/* ===== 主页 ===== */
#homeList{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 90px;}
.dream-card{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;
  background:var(--panel);margin-bottom:10px;position:relative;
  box-shadow:0 1px 3px rgba(0,0,0,.05);
}
.dream-card:active{background:var(--input-bg);}
.dream-avatar{width:50px;height:50px;border-radius:12px;background:var(--input-bg);border:1px solid var(--avatar-border);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.dream-avatar img{width:100%;height:100%;object-fit:cover;}
.dream-avatar .ph{font-size:20px;color:var(--text-sub);}
.dream-info{flex:1;min-width:0;}
.dream-name{font-weight:600;font-size:15px;margin-bottom:2px;}
.dream-preview{font-size:12.5px;color:var(--text-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dream-badge{background:var(--btn);color:var(--btn-text);font-size:11px;border-radius:10px;padding:1px 7px;margin-left:6px;}
.home-empty{text-align:center;color:var(--text-sub);padding:60px 20px;font-size:14px;}

/* 主页底部按钮区 */
.home-fab-bar{
  position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;gap:12px;align-items:center;z-index:15;
}
.fab{
  width:52px;height:52px;border-radius:50%;background:var(--btn);color:var(--btn-text);
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.18);
}
.fab:active{transform:scale(.94);}
.fab.fab-plain{
  width:44px;height:44px;background:var(--panel);color:var(--text-sub);
  box-shadow:0 2px 8px rgba(0,0,0,.10);border:1px solid var(--divider);
}
.home-hint{position:absolute;left:12px;bottom:calc(24px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--text-sub);max-width:60%;}

/* ===== 聊天页 ===== */
#chatTop{
  display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--nav-bg);
  border-bottom:1px solid var(--divider);
}
.top-avatar{width:46px;height:46px;border-radius:50%;overflow:hidden;border:1px solid var(--avatar-border);background:var(--input-bg);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.top-avatar img{width:100%;height:100%;object-fit:cover;}
.top-avatar .ph{font-size:18px;color:var(--text-sub);}
.top-name{font-size:12px;color:var(--text-sub);max-width:70px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;margin-top:2px;}
.top-col{display:flex;flex-direction:column;align-items:center;flex-shrink:0;cursor:pointer;}
.top-heart{flex-shrink:0;}
.func-strip{display:flex;gap:6px;margin-left:auto;align-items:center;flex-shrink:0;}
.func-btn{
  width:24px;height:24px;border-radius:50%;background:var(--input-bg);color:var(--btn);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.func-btn:active{transform:scale(.9);}
.func-btn svg{width:14px;height:14px;}

/* 聊天背景调整：填满、靠下、半透明遮罩 */
#msgList{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 8px;
  background-color: var(--bg);
  background-size: cover;
  background-repeat: no-repeat;
  background-position: center bottom;
  background-blend-mode: multiply;
  background-image: linear-gradient(rgba(255,255,255,0.85), rgba(255,255,255,0.85));
}
body.is-dark-bg #msgList {
  background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7));
}

.day-divider{text-align:center;color:var(--text-sub);font-size:11.5px;margin:14px 0 10px;}
.sys-msg{text-align:center;margin:10px 0;}
.sys-msg span{display:inline-block;background:rgba(128,128,128,.14);color:var(--text-sub);font-size:12px;padding:4px 12px;border-radius:12px;}

.msg-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:12px;}
.msg-row.user{flex-direction:row-reverse;}
.msg-avatar{width:34px;height:34px;border-radius:50%;overflow:hidden;background:var(--input-bg);border:1px solid var(--avatar-border);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.msg-avatar img{width:100%;height:100%;object-fit:cover;}
.msg-avatar .ph{font-size:15px;color:var(--text-sub);}
.msg-body{max-width:72%;display:flex;flex-direction:column;}
.msg-row.user .msg-body{align-items:flex-end;}
.msg-meta{font-size:11px;color:var(--text-sub);margin-bottom:3px;display:flex;gap:6px;align-items:center;}
.msg-row.user .msg-meta{flex-direction:row-reverse;}
.bubble{
  position:relative;padding:8px 12px;border-radius:14px;font-size:14.5px;word-break:break-word;
  white-space:pre-wrap;line-height:1.5;
}
.msg-row.dream .bubble{background:var(--dream-bubble);color:var(--dream-text);border-top-left-radius:4px;}
.msg-row.user .bubble{background:var(--user-bubble);color:var(--user-text);border-top-right-radius:4px;}
/* 气泡形状 */
body.shape-tail .msg-row.dream .bubble::after{content:"";position:absolute;left:-6px;top:8px;width:0;height:0;border-top:6px solid transparent;border-bottom:0 solid transparent;border-right:7px solid var(--dream-bubble);z-index:-1;}
body.shape-tail .msg-row.user .bubble::after{content:"";position:absolute;right:-6px;top:8px;width:0;height:0;border-top:6px solid transparent;border-left:7px solid var(--user-bubble);z-index:-1;}
body.shape-round .bubble{border-radius:18px!important;}
body.shape-capsule .bubble{border-radius:22px!important;}
body.shape-rect .bubble{border-radius:6px!important;}
.star-deco{position:absolute;top:-7px;right:-5px;width:14px;height:14px;color:var(--accent);}
.quote-block{border-left:3px solid var(--accent);padding:4px 8px;margin-bottom:5px;font-size:12.5px;color:var(--text-sub);background:rgba(128,128,128,.08);border-radius:4px;}
.msg-img{max-width:180px;max-height:180px;border-radius:10px;display:block;}
.msg-sticker{width:110px;height:110px;object-fit:contain;display:block;}
.msg-status{font-size:10.5px;color:var(--text-sub);margin-top:3px;}

/* 拼接标签 */
.concat-badge {
  display:inline-block; font-size:10px; color:var(--text-sub); margin-top:4px;
  background: rgba(128,128,128,.08); padding: 1px 6px; border-radius: 6px;
}

/* 打字提示 */
.typing-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:12px;}
.typing-box{background:var(--typing-bg);color:var(--typing-text);padding:9px 14px;border-radius:14px;border-top-left-radius:4px;font-size:13.5px;display:flex;align-items:center;gap:6px;}
.typing-dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--typing-text);margin:0 1px;animation:blink 1.2s infinite;}
.typing-dots span:nth-child(2){animation-delay:.2s;}
.typing-dots span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}

/* 问卷卡片 */
.survey-card{background:var(--panel);border:1px solid var(--divider);border-radius:14px;padding:12px;min-width:200px;max-width:260px;}
.survey-title{font-weight:600;font-size:14px;margin-bottom:8px;}
.survey-opt{padding:7px 10px;border-radius:9px;background:var(--input-bg);margin-bottom:6px;font-size:13.5px;}
.survey-opt.picked{background:var(--user-bubble);color:var(--user-text);font-weight:600;}
.survey-result{font-size:12px;color:var(--accent);margin-top:4px;}

/* 输入区 */
#inputBar{
  display:flex;align-items:flex-end;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));
  background:var(--nav-bg);border-top:1px solid var(--divider);
}
.ib-btn{width:38px;height:38px;border-radius:50%;background:var(--input-bg);color:var(--btn);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ib-btn:active{transform:scale(.92);}
.ib-btn svg{width:20px;height:20px;}
#msgInput{
  flex:1;min-height:38px;max-height:110px;border-radius:19px;background:var(--input-bg);color:var(--input-text);
  border:none;padding:9px 14px;resize:none;font-size:16px;line-height:1.4;
}
#sendBtn{width:38px;height:38px;border-radius:50%;background:var(--btn);color:var(--btn-text);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
#sendBtn svg{width:20px;height:20px;}
#quotePreview{display:flex;align-items:center;gap:8px;padding:6px 14px;background:var(--input-bg);font-size:12.5px;color:var(--text-sub);border-top:1px solid var(--divider);}
#quotePreview .qp-text{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ===== 字卡库 ===== */
#libTabs{display:flex;background:var(--nav-bg);border-bottom:1px solid var(--divider);padding:0 8px;}
.lib-tab{flex:1;padding:12px 0;text-align:center;font-size:14px;color:var(--text-sub);border-bottom:2px solid transparent;}
.lib-tab.active{color:var(--text);border-bottom-color:var(--btn);font-weight:600;}
#libBody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;padding-bottom:40px;}
.lib-toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center;}
.lib-btn{padding:6px 12px;border-radius:9px;background:var(--input-bg);color:var(--text);font-size:13px;}
.lib-btn:active{opacity:.7;}
.lib-btn.primary{background:var(--btn);color:var(--btn-text);}
.lib-count{font-size:12px;color:var(--text-sub);margin-left:auto;}
.lib-item{display:flex;align-items:center;gap:10px;padding:9px 10px;background:var(--panel);border-radius:10px;margin-bottom:6px;}
.lib-item .li-text{flex:1;font-size:14px;word-break:break-word;}
.lib-item input[type=checkbox]{width:18px;height:18px;accent-color:var(--btn);}
.lib-del{width:26px;height:26px;border-radius:50%;background:var(--input-bg);color:var(--text-sub);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.lib-thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--input-bg);}
.lib-empty{text-align:center;color:var(--text-sub);padding:40px;font-size:13.5px;}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--divider);gap:12px;}
.setting-label{font-size:14px;}
.setting-sub{font-size:11.5px;color:var(--text-sub);margin-top:2px;}
.switch{width:46px;height:26px;border-radius:13px;background:var(--input-bg);position:relative;transition:.2s;flex-shrink:0;border:1px solid var(--divider);}
.switch.on{background:var(--btn);border-color:var(--btn);}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.switch.on::after{left:22px;}
.setting-num{width:66px;padding:6px 8px;border-radius:8px;border:1px solid var(--divider);background:var(--input-bg);color:var(--input-text);text-align:center;font-size:16px;}
.setting-slider{flex:1;accent-color:var(--btn);}
.setting-val{font-size:13px;color:var(--text-sub);min-width:44px;text-align:right;}

/* 默认字卡区块 */
.default-card-block{
  background:var(--panel);border:1px solid var(--divider);border-radius:14px;
  padding:12px;margin-bottom:14px;
}
.default-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;}
.default-card-title{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px;}
.default-card-badge{background:var(--btn);color:var(--btn-text);font-size:11px;border-radius:9px;padding:1px 8px;}
.default-card-sub{font-size:12px;color:var(--text-sub);margin-bottom:10px;line-height:1.5;}
.default-card-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.default-card-list{max-height:260px;overflow-y:auto;-webkit-overflow-scrolling:touch;border-top:1px solid var(--divider);}
.default-card-item{padding:7px 4px;font-size:13.5px;color:var(--text-sub);border-bottom:1px solid var(--divider);}
.default-card-item:last-child{border-bottom:none;}
.default-card-more{text-align:center;padding:10px;font-size:13px;color:var(--btn);}

/* ===== 弹窗 ===== */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .15s;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal{background:var(--panel);color:var(--text);border-radius:18px;width:100%;max-width:420px;max-height:86vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px;animation:pop .18s;}
@keyframes pop{from{transform:scale(.94);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal h3{margin:0 0 14px;font-size:17px;}
.modal-actions{display:flex;gap:10px;margin-top:16px;}
.modal-actions button{flex:1;padding:11px;border-radius:11px;font-size:15px;background:var(--input-bg);color:var(--text);}
.modal-actions button.primary{background:var(--btn);color:var(--btn-text);}
.modal-input{width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--divider);background:var(--input-bg);color:var(--input-text);margin-bottom:10px;}
.modal-label{font-size:13px;color:var(--text-sub);margin:10px 0 6px;}
.profile-avatar-edit{width:84px;height:84px;border-radius:50%;margin:0 auto 14px;background:var(--input-bg);border:1px solid var(--avatar-border);overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative;}
.profile-avatar-edit img{width:100%;height:100%;object-fit:cover;}
.profile-avatar-edit .ph{font-size:30px;color:var(--text-sub);}
.avatar-hint{text-align:center;font-size:12px;color:var(--text-sub);margin-bottom:12px;}

/* 主题网格 */
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.theme-swatch{border-radius:12px;padding:10px 6px;text-align:center;font-size:12px;border:2px solid transparent;cursor:pointer;}
.theme-swatch.active{border-color:var(--btn);}
.theme-dot{width:30px;height:30px;border-radius:50%;margin:0 auto 6px;border:1px solid rgba(0,0,0,.1);}
.color-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;}
.color-row input[type=color]{width:44px;height:30px;border:none;background:none;padding:0;}
.shape-row{display:flex;gap:8px;flex-wrap:wrap;}
.shape-opt{padding:8px 14px;border-radius:10px;background:var(--input-bg);font-size:13px;border:2px solid transparent;}
.shape-opt.active{border-color:var(--btn);}

/* 字体选择 */
.font-row{display:flex;flex-wrap:wrap;gap:8px;}
.font-opt{padding:9px 14px;border-radius:10px;background:var(--input-bg);font-size:13.5px;border:2px solid transparent;line-height:1.3;}
.font-opt.active{border-color:var(--btn);}
.font-opt .fo-sample{display:block;font-size:11px;color:var(--text-sub);margin-top:2px;}

/* 表情选择器 */
.sticker-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.sticker-grid img{width:100%;aspect-ratio:1;object-fit:contain;background:var(--input-bg);border-radius:10px;padding:4px;}

/* 塔罗 */
#tarotLayer{position:fixed;inset:0;z-index:200;background:var(--tarot-bg);color:var(--tarot-text);display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));}
.tarot-close{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;width:34px;height:34px;border-radius:50%;background:rgba(128,128,128,.15);display:flex;align-items:center;justify-content:center;z-index:5;}
.tarot-title{text-align:center;font-size:20px;font-weight:700;color:var(--tarot-accent);margin:16px 0 6px;}
.tarot-sub{text-align:center;font-size:13px;color:var(--tarot-text);opacity:.7;margin-bottom:20px;}
.tarot-opts{display:flex;gap:12px;justify-content:center;margin-bottom:18px;}
.tarot-opt{padding:12px 20px;border-radius:12px;background:var(--tarot-card);border:2px solid transparent;font-size:14px;color:var(--tarot-text);}
.tarot-opt.active{border-color:var(--tarot-gold);}
.tarot-input{width:100%;max-width:340px;margin:0 auto 18px;display:block;padding:12px;border-radius:12px;border:1px solid var(--tarot-gold);background:var(--tarot-card);color:var(--tarot-text);}
.tarot-btn{display:block;margin:0 auto;padding:13px 34px;border-radius:14px;background:var(--tarot-accent);color:#fff;font-size:15px;font-weight:600;}
.tarot-cards{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:20px;}
.tarot-card-wrap{perspective:800px;width:110px;height:170px;cursor:pointer;}
.tarot-card-inner{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d;}
.tarot-card-wrap.flipped .tarot-card-inner{transform:rotateY(180deg);}
.tarot-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.tarot-back{background:linear-gradient(135deg,var(--tarot-accent),var(--tarot-gold));border:2px solid var(--tarot-gold);}
.tarot-front{background:var(--tarot-card);border:2px solid var(--tarot-gold);transform:rotateY(180deg);flex-direction:column;padding:6px;text-align:center;}
.tarot-front svg{width:60px;height:60px;}
.tarot-front .tn{font-size:11px;font-weight:700;color:var(--tarot-text);margin-top:4px;}
.tarot-front .tr{font-size:10px;color:var(--tarot-accent);}
.tarot-results{margin-top:20px;}
.tarot-result-item{background:var(--tarot-card);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--tarot-gold);}
.tarot-result-item .rt{font-weight:700;color:var(--tarot-accent);font-size:15px;}
.tarot-result-item .rp{font-size:12px;color:var(--tarot-gold);margin-bottom:6px;}
.tarot-result-item .rd{font-size:13px;line-height:1.6;color:var(--tarot-text);}

/* 通话层 */
#callLayer{position:fixed;inset:0;z-index:210;background:linear-gradient(160deg,#2a2a35,#1a1a22);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;}
#callLayer .call-avatar{width:110px;height:110px;border-radius:50%;overflow:hidden;border:3px solid rgba(255,255,255,.3);margin-bottom:18px;display:flex;align-items:center;justify-content:center;background:#3a3a48;}
#callLayer .call-avatar img{width:100%;height:100%;object-fit:cover;}
#callLayer .call-name{font-size:20px;font-weight:600;margin-bottom:8px;}
#callLayer .call-status{font-size:14px;opacity:.7;margin-bottom:30px;}
.call-btns{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;}
.call-btn{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;flex-direction:column;gap:2px;}
.call-btn.hang{background:#e05555;}
.call-btn.mute{background:rgba(255,255,255,.18);}
.call-btn.mini{background:rgba(255,255,255,.18);}

/* 通话小窗：正方形（微信风格） */
#callMini{
  position:fixed;z-index:211;
  width:72px;height:72px;
  border-radius:12px;
  background:#2a2a35;color:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(0,0,0,.35);
  touch-action:none;cursor:grab;
  border:2px solid rgba(255,255,255,.28);
}
#callMini:active{cursor:grabbing;}
#callMini .cm-timer{
  position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);
  white-space:nowrap;color:#fff;background:rgba(0,0,0,.55);
  padding:1px 7px;border-radius:6px;font-size:10px;
}

/* 信件 */
#letterDetail .letter-paper{background:var(--panel);border-radius:10px;padding:18px 16px 18px 30px;position:relative;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
#letterDetail .letter-paper::before{content:"";position:absolute;left:16px;top:0;bottom:0;width:1px;background:var(--accent);opacity:.45;}
.letter-lines{background-image:repeating-linear-gradient(transparent,transparent 27px,var(--divider) 27px,var(--divider) 28px);line-height:28px;font-size:14px;white-space:pre-wrap;word-break:break-word;min-height:60px;}
.letter-stamp{position:absolute;top:10px;right:12px;width:44px;height:52px;border:1.5px dashed var(--accent);border-radius:3px;display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:9px;transform:rotate(6deg);opacity:.8;}
.letter-head{font-size:12px;color:var(--text-sub);margin-bottom:10px;}
.letter-status-badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:9px;background:var(--input-bg);color:var(--text-sub);margin-top:8px;}
.letter-item{background:var(--panel);border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.letter-item .li-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.letter-item .li-title{font-weight:600;font-size:14px;}
.letter-item .li-preview{font-size:12.5px;color:var(--text-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.letter-unread-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;}
#letterToast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:300;background:var(--btn);color:var(--btn-text);padding:10px 18px;border-radius:14px;font-size:13.5px;box-shadow:0 4px 16px rgba(0,0,0,.2);animation:slideDown .3s;}
@keyframes slideDown{from{transform:translate(-50%,-20px);opacity:0;}to{transform:translate(-50%,0);opacity:1;}}

/* 长按菜单 */
#ctxMenu{position:fixed;z-index:250;background:var(--panel);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.2);overflow:hidden;min-width:130px;animation:pop .12s;}
#ctxMenu button{display:flex;align-items:center;gap:9px;width:100%;padding:11px 16px;font-size:14px;text-align:left;color:var(--text);}
#ctxMenu button:active{background:var(--input-bg);}

/* 拍一拍面板 */
#patPanel{position:fixed;left:0;right:0;bottom:0;z-index:220;background:var(--panel);border-top-left-radius:18px;border-top-right-radius:18px;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 24px rgba(0,0,0,.18);animation:slideUp .2s;}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
#patPanel .pat-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
#patPanel .pat-title{font-weight:600;font-size:15px;}
#patPanel .pat-close{width:30px;height:30px;border-radius:50%;background:var(--input-bg);color:var(--text-sub);display:flex;align-items:center;justify-content:center;}
.pat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:52vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.pat-item{position:relative;padding:10px 12px;padding-right:32px;border-radius:11px;background:var(--input-bg);font-size:13.5px;line-height:1.35;text-align:left;}
.pat-item:active{opacity:.75;}
.pat-item .pat-del{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:var(--panel);color:var(--text-sub);display:flex;align-items:center;justify-content:center;font-size:12px;}
.pat-add{grid-column:1 / -1;padding:11px;border-radius:11px;border:1px dashed var(--divider);color:var(--text-sub);font-size:13.5px;text-align:center;background:transparent;}

/* 响应式 */
@media(max-width:520px){
  .top-avatar{width:42px;height:42px;}
  .top-heart{width:48px;}
  .func-btn{width:22px;height:22px;}
  .func-btn svg{width:13px;height:13px;}
  .func-strip{gap:4px;}
  .top-name{max-width:52px;}
}
</style>

/* ================= IndexedDB ================= */
let dbPromise=null;
function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((res,rej)=>{
    const req = indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded = e=>{ const db=e.target.result; if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE); };
    req.onsuccess = e=>res(e.target.result);
    req.onerror = e=>rej(e.target.error);
  });
  return dbPromise;
}
async function idbPut(key,dataURL){ const db=await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction(IDB_STORE,'readwrite'); tx.objectStore(IDB_STORE).put(dataURL,key); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
async function idbGet(key){ const db=await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction(IDB_STORE,'readonly'); const r=tx.objectStore(IDB_STORE).get(key); r.onsuccess=()=>res(r.result||null); r.onerror=()=>rej(r.error); }); }
async function idbDel(key){ const db=await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction(IDB_STORE,'readwrite'); tx.objectStore(IDB_STORE).delete(key); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }

function applyTheme(settings){
  const root=document.documentElement;
  const tid = THEME_ALIAS[settings.themeId] || settings.themeId;
  const theme = THEMES.find(t=>t.id===tid)||THEMES[0];
  const vars = settings.customColors ? Object.assign({},theme.vars,settings.customColors) : theme.vars;
  Object.entries(vars).forEach(([k,v])=>root.style.setProperty(k,v));
  root.style.setProperty('--app-font', getFontStack(settings.fontFamily));
  document.body.className = 'shape-'+(settings.shape||'tail');
  
  const isDark = isDarkColor(vars['--bg']);
  if (isDark) {
    document.body.classList.add('is-dark-bg');
  } else {
    document.body.classList.remove('is-dark-bg');
  }

  root.style.setProperty('--user-text', isDark?'#f0f0f0':'#2f3a2a');
  if(settings.customColors){
    root.style.setProperty('--dream-text', isDark?'#f0f0f0':'#333');
  }
}
function isDarkColor(hex){
  if(!hex) return false;
  if(hex.startsWith('rgba')||hex.startsWith('rgb')) return false;
  const c=hex.replace('#',''); if(c.length<6) return false;
  const r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);
  return (r*299+g*587+b*114)/1000 < 128;
}
async function applyChatBackground(settings){
  const list=document.getElementById('msgList');
  let bgUrl = null;
  if(settings.bgImageKey){
    bgUrl = await idbGet(settings.bgImageKey);
  } else if(settings.bgImage) {
    bgUrl = settings.bgImage;
  }
  
  if(bgUrl){
    list.style.backgroundImage = `linear-gradient(var(--bg-mask, rgba(255,255,255,0.85)), var(--bg-mask, rgba(255,255,255,0.85))), url(${bgUrl})`;
    list.style.backgroundSize = 'cover';
    list.style.backgroundPosition = 'center bottom';
  } else {
    list.style.backgroundImage = 'none';
  }
}

async function renderMessages(){
  const list=document.getElementById('msgList');

  if(!data||!dream){ list.innerHTML=''; return; }
  const dreamAv=await loadDreamAvatar(state.currentDreamId);

    if(m.type==='pat'){ html+=`<div class="sys-msg"><span>${esc(m.text)}</span></div>`; continue; }
    const isUser=m.role==='user';
    const avatarSrc = isUser ? profAv : dreamAv;
    const name = isUser ? (state.profile.name||'我') : dream.name;

    if(m.quote){ inner+=`<div class="quote-block">${esc(m.quote.name)}：${esc(m.quote.text.slice(0,40))}</div>`; }

      inner+=`<div class="bubble">${esc(m.text)}${data.settings.starDeco&&!isUser?'<svg class="star-deco" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.6L22 9.3l-5 4.8 1.2 7.1L12 17.8 5.8 21.2 7 14.1 2 9.3l7.1-.7z"/></svg>':''}</div>`;
      if (m.isConcat) {
        inner+=`<div class="concat-badge">✨ 拼接字卡</div>`;
      }
    }
    else if(m.type==='image'){ inner+=`<img class="msg-img" src="${m.src}">`; }
    else if(m.type==='sticker'){ inner+=`<img class="msg-sticker" src="${m.src}">`; }
    else if(m.type==='survey'){ inner+=renderSurveyCard(m,isUser); }
    const status = (data.settings.readReceipt&&isUser&&m.read!==undefined) ? `<div class="msg-status">${m.read?'已讀':'未讀'}</div>`:'';
    html+=`<div class="msg-row ${isUser?'user':'dream'}" data-mid="${m.id}">

        <div class="msg-meta"><span>${esc(name)}</span><span>${fmtTime(m.ts)}</span></div>
        ${inner}${status}
      </div>

  }

  bindMsgLongPress();

}

/* ================= 消息发送 ================= */
function sendText(){
  const input=document.getElementById('msgInput');
  const text=input.value.trim();
  if(!text) return;
  pushMessage({role:'user',type:'text',text,quote:pendingQuote?{name:pendingQuote.name,text:pendingQuote.text}:null});
  input.value=''; input.style.height='38px';
  cancelQuote();
  scheduleDreamReply();
}
function pickChatImage(){
  const f=document.getElementById('hiddenFile');
  f.accept='image/*'; f.value='';
  f.onchange=async()=>{
    const file=f.files[0]; if(!file) return;
    const dataURL=await readFileAsDataURL(file);
    const key=`img_${uid()}`;
    await idbPut(idbKey(state.currentDreamId,key),dataURL);
    pushMessage({role:'user',type:'image',src:dataURL,imageKey:key});
    scheduleDreamReply();
  };
  f.click();
}
function pushMessage(msg){
  const m={id:uid(),ts:now(),read:false,...msg};
  state.data.messages.push(m);
  saveData(state.currentDreamId,state.data);
  renderMessages();
  return m;
}
function scheduleDreamReply(){
  const data=state.data;
  if(!data) return;
  const delay=data.settings.replyDelay*1000;
  if(typingTimer) clearTimeout(typingTimer);
  if(data.settings.typingEnabled) showTyping();
  typingTimer=setTimeout(()=>{
    hideTyping();
    dreamReply();
  },delay);
}
function showTyping(){
  const list=document.getElementById('msgList');
  const dream=getDream(state.currentDreamId);
  const data=state.data;
  const old=document.getElementById('typingRow'); if(old) old.remove();
  const el=document.createElement('div');
  el.id='typingRow'; el.className='typing-row';
  el.innerHTML=`${data.settings.typingAvatar&&dream.avatarKey?`<div class="msg-avatar"><img src="${dream.avatarKey.startsWith('data:')?dream.avatarKey:''}"></div>`:(data.settings.typingAvatar?'<div class="msg-avatar"><span class="ph">?</span></div>':'')}
    <div class="typing-box">${esc(data.settings.typingText)}<span class="typing-dots"><span></span><span></span><span></span></span></div>`;
  el.onclick=()=>{ const t=prompt('自訂打字提示文字',data.settings.typingText); if(t){ data.settings.typingText=t; saveData(state.currentDreamId,data); const box=el.querySelector('.typing-box'); box.firstChild.textContent=t; } };
  list.appendChild(el);
  
  list.scrollTop = list.scrollHeight;
  setTimeout(() => { list.scrollTop = list.scrollHeight; }, 50);
}
function hideTyping(){ const el=document.getElementById('typingRow'); if(el) el.remove(); }

function dreamReply(){
  const data=state.data; if(!data) return;
  const pool=getReplyPool(data);
  if(!pool.length) return;
  const lastUser=[...data.messages].reverse().find(m=>m.role==='user'&&m.type==='text');
  let quote=null;
  if(data.settings.quoteEnabled && lastUser && Math.random()<0.4){
    quote={name:state.profile.name||'我',text:lastUser.text};
  }

  let finalText = '';
  let isConcat = false;
  const s = data.settings;

  if (s.concatEnabled && Math.random() < (s.concatChance/100)) {
    isConcat = true;
    const count = randInt(s.concatMin || 2, s.concatMax || 5);
    const parts = [];
    for(let i=0;i<count;i++) {
      parts.push(pick(pool));
    }
    finalText = parts.join('，');
  } else {
    finalText = pick(pool);
  }

  pushMessage({role:'dream',type:'text',text:finalText,quote,isConcat});
  if(data.settings.readReceipt){ data.messages.forEach(m=>{ if(m.role==='user') m.read=true; }); saveData(state.currentDreamId,data); }
}
function nudgeDream(){
  if(!state.data) return;
  showTyping();
  setTimeout(()=>{ hideTyping(); dreamReply(); },1200);
}
function quoteMsg(mid){
  const m=state.data.messages.find(x=>x.id===mid); if(!m) return;
  const name=m.role==='user'?(state.profile.name||'我'):getDream(state.currentDreamId).name;
  pendingQuote={name,text:m.text||'[媒體]'};
  document.getElementById('qpText').textContent=`引用 ${name}：${(m.text||'[媒體]').slice(0,30)}`;
  document.getElementById('quotePreview').classList.remove('hidden');
  document.getElementById('msgInput').focus();
}
function cancelQuote(){ pendingQuote=null; document.getElementById('quotePreview').classList.add('hidden'); }
function copyMsg(mid){
  const m=state.data.messages.find(x=>x.id===mid); if(!m) return;
  navigator.clipboard?.writeText(m.text||'').then(()=>toast('已複製')).catch(()=>toast('複製失敗'));
}
function deleteMsg(mid){
  state.data.messages=state.data.messages.filter(m=>m.id!==mid);
  saveData(state.currentDreamId,state.data);
  renderMessages();
}

let callState=null;
function renderCallUI(av,name,statusText,accepted){
  const avHtml = av?`<img src="${av}">`:'<span style="font-size:36px;color:#fff;">?</span>';
  let btns;
  if(accepted){
    btns = `<button class="call-btn mute" onclick="this.style.opacity=.4"><span>靜音</span></button>
            <button class="call-btn mini" onclick="minimizeCall()"><span>縮小</span></button>
            <button class="call-btn hang" onclick="endCall(true)"><span>掛斷</span></button>`;
  } else {
    btns = `<button class="call-btn hang" onclick="endCall(true)"><span>掛斷</span></button>
            <button class="call-btn mini" onclick="minimizeCall()"><span>縮小</span></button>`;
  }
  const overlay=document.createElement('div');
  overlay.id='callLayer';
  overlay.innerHTML=`<div class="call-avatar">${avHtml}</div>
    <div class="call-name">${esc(name)}</div>
    <div class="call-status" id="callStatus">${statusText}</div>
    <div class="call-btns">${btns}</div>`;
  document.getElementById('callRoot').appendChild(overlay);
}
async function startCall(){
  const dream=getDream(state.currentDreamId); if(!dream) return;
  const av=await loadDreamAvatar(state.currentDreamId);
  const accepted=Math.random()<0.5;
  renderCallUI(av,dream.name,'正在撥號...',false);
  callState={start:now(),dreamId:dream.id,accepted:false};
  setTimeout(()=>{
    if(!callState) return;
    if(accepted){
      callState.accepted=true;
      const old=document.getElementById('callLayer'); if(old) old.remove();
      renderCallUI(av,dream.name,'00:00',true);
      const timer=setInterval(()=>{ if(!callState) return; const sec=Math.floor((now()-callState.start)/1000); const st=document.getElementById('callStatus'); if(st) st.textContent=`${Math.floor(sec/60).toString().padStart(2,'0')}:${(sec%60).toString().padStart(2,'0')}`; },1000);
      callState.timer=timer;
    } else {
      endCall(true,'對方已拒絕');
    }
  },2500);
}
async function incomingCall(){
  const dream=getDream(state.currentDreamId); if(!dream) return;
  if(callState) return;
  const av=await loadDreamAvatar(state.currentDreamId);
  const avHtml = av?`<img src="${av}">`:'<span style="font-size:36px;color:#fff;">?</span>';
  const overlay=document.createElement('div');
  overlay.id='callLayer';
  overlay.innerHTML=`<div class="call-avatar">${avHtml}</div>
    <div class="call-name">${esc(dream.name)}</div>
    <div class="call-status">來電中...</div>
    <div class="call-btns">
      <button class="call-btn hang" onclick="endCall(true,'未接來電')">拒絕</button>
      <button class="call-btn mute" onclick="acceptIncoming()">接聽</button>
      <button class="call-btn mini" onclick="minimizeCall()">縮小</button>
    </div>`;
  document.getElementById('callRoot').appendChild(overlay);
  callState={incoming:true,dreamId:dream.id};
  callState.timeout=setTimeout(()=>{ if(callState&&callState.incoming){ endCall(true,'未接來電'); } },15000);
}
function acceptIncoming(){
  if(!callState) return;
  clearTimeout(callState.timeout);
  callState={start:now(),dreamId:state.currentDreamId,accepted:true};
  const old=document.getElementById('callLayer'); if(old) old.remove();
  const dream=getDream(state.currentDreamId);
  loadDreamAvatar(state.currentDreamId).then(av=>{
    renderCallUI(av,dream?.name||'',"00:00",true);
    const timer=setInterval(()=>{ if(!callState||!callState.accepted) return; const sec=Math.floor((now()-callState.start)/1000); const st=document.getElementById('callStatus'); if(st) st.textContent=`${Math.floor(sec/60).toString().padStart(2,'0')}:${(sec%60).toString().padStart(2,'0')}`; },1000);
    callState.timer=timer;
  });
}
const MINI_SIZE = 72;
function clampMiniPos(x,y){
  const maxX = window.innerWidth - MINI_SIZE - 6;
  const maxY = window.innerHeight - MINI_SIZE - 6;
  return { x: Math.max(6, Math.min(maxX, x)), y: Math.max(6, Math.min(maxY, y)) };
}
function minimizeCall(){
  if(!callState) return;
  const overlay=document.getElementById('callLayer'); if(overlay) overlay.remove();
  if(document.getElementById('callMini')) return;
  const mini=document.createElement('div');
  mini.id='callMini';
  mini.innerHTML=`<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h4l2 5-3 2a13 13 0 0 0 5 5l2-3 5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg><span class="cm-timer" id="cmTimer">00:00</span>`;
  const init=clampMiniPos(window.innerWidth - MINI_SIZE - 24, window.innerHeight - MINI_SIZE - 100);
  mini.style.left=init.x+'px';
  mini.style.top=init.y+'px';
  document.body.appendChild(mini);
  let dragging=false, moved=false, sx=0, sy=0, ox=0, oy=0;
  const startDrag = (x,y)=>{ dragging=true; moved=false; sx=x; sy=y; ox=mini.offsetLeft; oy=mini.offsetTop; };
  const moveDrag = (x,y)=>{
    if(!dragging) return;
    const dx=x-sx, dy=y-sy;
    if(Math.abs(dx)>3||Math.abs(dy)>3) moved=true;
    const p=clampMiniPos(ox+dx, oy+dy);
    mini.style.left=p.x+'px'; mini.style.top=p.y+'px';
  };
  const endDrag = ()=>{ if(dragging && !moved){ resumeCallFromMini(); } dragging=false; };
  mini.addEventListener('touchstart',e=>{ const t=e.touches[0]; startDrag(t.clientX,t.clientY); },{passive:true});
  mini.addEventListener('touchmove',e=>{ e.preventDefault(); const t=e.touches[0]; moveDrag(t.clientX,t.clientY); },{passive:false});
  mini.addEventListener('touchend',()=>endDrag());
  mini.addEventListener('mousedown',e=>{ e.preventDefault(); startDrag(e.clientX,e.clientY); });
  window.addEventListener('mousemove',e=>{ if(dragging) moveDrag(e.clientX,e.clientY); });
  window.addEventListener('mouseup',()=>{ if(dragging) endDrag(); });
  if(callState.timer) clearInterval(callState.timer);
  callState.timer=setInterval(()=>{ if(!callState) return; const sec=Math.floor((now()-callState.start)/1000); const el=document.getElementById('cmTimer'); if(el) el.textContent=`${Math.floor(sec/60).toString().padStart(2,'0')}:${(sec%60).toString().padStart(2,'0')}`; },1000);
}
async function resumeCallFromMini(){
  if(!callState) return;
  const mini=document.getElementById('callMini'); if(mini) mini.remove();
  const dream=getDream(state.currentDreamId);
  const av=await loadDreamAvatar(state.currentDreamId);
  const sec=callState.start?Math.floor((now()-callState.start)/1000):0;
  const statusText=`${Math.floor(sec/60).toString().padStart(2,'0')}:${(sec%60).toString().padStart(2,'0')}`;
  renderCallUI(av,dream?.name||'',statusText,true);
  if(callState.timer) clearInterval(callState.timer);
  callState.timer=setInterval(()=>{ if(!callState) return; const s=Math.floor((now()-callState.start)/1000); const st=document.getElementById('callStatus'); if(st) st.textContent=`${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`; },1000);
}
function endCall(record,reason){
  const el=document.getElementById('callLayer'); if(el) el.remove();
  const mini=document.getElementById('callMini'); if(mini) mini.remove();
  if(callState?.timer) clearInterval(callState.timer);
  if(callState?.timeout) clearTimeout(callState.timeout);
  const sec=callState?Math.floor((now()-(callState.start||now()))/1000):0;
  const dreamId=callState?.dreamId||state.currentDreamId;
  callState=null;
  if(record&&dreamId){
    const data=getData(dreamId);
    let text;
    if(reason==='對方已拒絕') text='通話結束 · 對方已拒絕';
    else if(reason==='未接來電') text='通話結束 · 未接來電';
    else text=`通話結束 · ${Math.floor(sec/60).toString().padStart(2,'0')}:${(sec%60).toString().padStart(2,'0')}`;
    data.messages.push({id:uid(),ts:now(),role:'system',type:'call',text});
    saveData(dreamId,data);
    if(dreamId===state.currentDreamId&&state.data) state.data=data;
    if(document.getElementById('pageChat').classList.contains('active')) renderMessages();
  }
}

window.sqRemove=function(i){ const vals=[...document.querySelectorAll('#sqOpts input')].map(x=>x.value); if(vals.length<=2){toast('至少 2 個選項');return;} vals.splice(i,1); openSurveyBuilderWith(vals); };

function selectAll(kind){ document.querySelectorAll(`input[data-lib="${kind}"]`).forEach(c=>c.checked=true); }
function delSelected(kind){
  const data=state.data;
  const checked=[...document.querySelectorAll(`input[data-lib="${kind}"]:checked`)].map(c=>+c.dataset.i);
  if(!checked.length){ toast('請先選擇'); return; }
  const arr = kind==='cards'?data.cards:kind==='kaomoji'?data.kaomoji:data.stickers;
  const kept = arr.filter((_,i)=>!checked.includes(i));
  if(kind==='cards') data.cards=kept; else if(kind==='kaomoji') data.kaomoji=kept; else data.stickers=kept;

function mergeCards(lines){
  const data=state.data;
  const exist=new Set(data.cards.map(c=>c.trim()));
  let added=0;
  lines.forEach(l=>{ const v=l.trim(); if(v&&!exist.has(v)){ data.cards.push(v); exist.add(v); added++; } });
  saveData(state.currentDreamId,data); renderLib(); toast(`新增 ${added} 張字卡`);
}

  const txt=state.data.cards.join('\n');

async function importStickers(){
  const f=document.getElementById('hiddenFile'); f.accept='image/*'; f.multiple=true; f.value='';
  f.onchange=async()=>{
    const files=[...f.files].slice(0,100);
    if(!files.length) return;
    const data=state.data; 
    const exist=new Set(data.stickers);
    let added=0;
    toast(`開始上傳 ${files.length} 張圖片...`);

    for(const file of files){ 
      try {
        const url=await readFileAsDataURL(file); 
        if(!exist.has(url)){ 
          data.stickers.push(url); 
          exist.add(url); 
          added++; 
          saveData(state.currentDreamId,data); 
        }
      } catch(e) {
        console.warn('單張圖片讀取失敗', e);
      }
    }
    renderLib(); 
    toast(`成功新增 ${added} 個表情包`);
  };
  f.click();
}
function exportStickers(){ toast('表情包匯出：請長按單個保存（瀏覽器限制）'); }
function downloadText(text,name){
  const blob=new Blob([text],{type:'text/plain'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); URL.revokeObjectURL(a.href);
}

  else obj={cards:data.cards,kaomoji:data.kaomoji,stickers:data.stickers,patCards:data.settings.patCards};

  const f=document.getElementById('hiddenFile'); f.accept='.json'; f.value='';
  f.onchange=async()=>{ const file=f.files[0]; if(!file) return; const text=await file.text(); try{ const obj=JSON.parse(text); if(kind==='all'&&obj.data){ state.data=Object.assign(getData(state.currentDreamId),obj.data); } else if(kind==='chat'&&obj.messages){ state.data.messages=obj.messages; } else if(kind==='cards'){ if(obj.cards) state.data.cards=obj.cards; if(obj.kaomoji) state.data.kaomoji=obj.kaomoji; if(obj.stickers) state.data.stickers=obj.stickers; if(obj.patCards) state.data.settings.patCards=obj.patCards; } saveData(state.currentDreamId,state.data); renderLib(); toast('匯入完成'); }catch(e){ toast('格式錯誤'); } };

}

function pickAddDreamAvatar(){
  const f=document.getElementById('hiddenFile'); f.accept='image/*'; f.value='';
  f.onchange=async()=>{ const file=f.files[0]; if(!file) return; try{ const url=await readFileAsDataURL(file); window.__newDreamAvatar=url; const box=document.getElementById('addDreamAvatarBox'); box.innerHTML=`<img src="${url}">`; }catch(e){ toast('讀取失敗'); } };
  f.click();
}
async function createDream(){
  const name=document.getElementById('newDreamName').value.trim();
  if(!name){ toast('請輸入名字'); return; }
  const d={id:uid(),name,avatarKey:null};
  state.dreams.push(d); saveDreams();
  ensureData(d.id);
  if(window.__newDreamAvatar){
    try{ await saveDreamAvatar(d.id,window.__newDreamAvatar); }catch(e){ console.warn(e); }
  }
  closeModal(); await renderHome(); openChat(d.id);
}
async function openEditDream(){
  const dream=getDream(state.currentDreamId); if(!dream) return;
  let avHtml='<span class="ph">?</span>';
  const av=await loadDreamAvatar(dream.id);
  if(av) avHtml=`<img src="${av}">`;
  openModal(`<h3>編輯夢角</h3>
    <div class="profile-avatar-edit" onclick="pickAvatar('dream','${dream.id}')">${avHtml}</div>
    <div class="avatar-hint">點擊更換頭像</div>
    <div class="modal-label">名字</div>
    <input class="modal-input" id="editDreamName" maxlength="20" value="${esc(dream.name)}">
    <div class="modal-actions"><button onclick="closeModal()">取消</button><button class="primary" onclick="saveEditDream()">儲存</button></div>`);
}
function saveEditDream(){
  const dream=getDream(state.currentDreamId);
  dream.name=document.getElementById('editDreamName').value.trim()||dream.name;
  saveDreams(); closeModal(); renderHome();
  document.getElementById('navTitle').textContent=`與 ${dream.name} 聊天`;
  document.getElementById('topDreamName').textContent=dream.name;
  renderMessages();
}
function confirmDeleteDream(id){
  if(!confirm('刪除該夢角？其聊天、字卡、信件都會一併刪除。')) return;
  state.dreams=state.dreams.filter(d=>d.id!==id); saveDreams();
  localStorage.removeItem(dataKey(id));
  idbDel(idbKey(id,'avatar')).catch(()=>{});
  idbDel(idbKey(id,'bg')).catch(()=>{});
  state.letters=state.letters.filter(l=>l.dreamId!==id); saveLetters();
  closeCtxMenu(); goBack(); renderHome();
}

/* ================= 上下文菜单 ================= */
function showCtxMenu(x,y,items){
  closeCtxMenu();
  const menu=document.createElement('div'); menu.id='ctxMenu';
  menu.innerHTML=items.map((it,i)=>`<button data-i="${i}">${it.label}</button>`).join('');
  menu.style.left=Math.min(x,window.innerWidth-150)+'px'; menu.style.top=Math.min(y,window.innerHeight-160)+'px';
  document.body.appendChild(menu);
  menu.querySelectorAll('button').forEach((b,i)=>{ b.onclick=()=>{ const fn=items[i].fn; closeCtxMenu(); fn(); }; });
}
function closeCtxMenu(){ const m=document.getElementById('ctxMenu'); if(m) m.remove(); }
document.addEventListener('click',e=>{ if(!e.target.closest('#ctxMenu')) closeCtxMenu(); if(!e.target.closest('#patPanel') && !e.target.closest('button[title="拍一拍"]')) closePatPanel(); });

/* ================= 导航：返回主页 ================= */
function goBack(){
  document.getElementById('pageChat').classList.remove('active');
  document.getElementById('pageLib').classList.remove('active');
  document.getElementById('pageHome').classList.add('active');
  stopTimers();
  document.getElementById('navBack').classList.add('hidden');
  renderHome();
}

let tarotState={count:1,question:'',cards:[]};
function openTarot(){
  document.getElementById('tarotRoot').innerHTML=`<div id="tarotLayer">
    <button class="tarot-close" onclick="closeTarot()">✕</button>
    <div class="tarot-title">塔羅占卜</div>
    <div class="tarot-sub">選擇牌陣並提出你的問題</div>
    <div class="tarot-opts">
      <button class="tarot-opt active" id="topt1" onclick="setTarotCount(1)">單牌</button>
      <button class="tarot-opt" id="topt3" onclick="setTarotCount(3)">過去·現在·未來</button>
    </div>
    <input class="tarot-input" id="tarotQ" placeholder="你的問題（可選）">
    <button class="tarot-btn" onclick="drawTarot()">洗牌抽牌</button>
    <div class="tarot-cards" id="tarotCards"></div>
    <div class="tarot-results" id="tarotResults"></div>
  </div>`;
}
function closeTarot(){ document.getElementById('tarotRoot').innerHTML=''; }
function setTarotCount(n){ tarotState.count=n; document.getElementById('topt1').classList.toggle('active',n===1); document.getElementById('topt3').classList.toggle('active',n===3); }
function drawTarot(){
  tarotState.question=document.getElementById('tarotQ').value.trim();
  const pool=[...TAROT].sort(()=>Math.random()-0.5).slice(0,tarotState.count);
  tarotState.cards=pool.map(t=>({...t,rev:Math.random()<0.5}));
  const wrap=document.getElementById('tarotCards');
  wrap.innerHTML=tarotState.cards.map((c,i)=>`<div class="tarot-card-wrap" id="tc${i}" onclick="flipTarot(${i})"><div class="tarot-card-inner">
    <div class="tarot-face tarot-back"><svg width="30" height="30" viewBox="0 0 24 24" fill="var(--tarot-gold)"><path d="M12 2l2.9 6.6L22 9.3l-5 4.8 1.2 7.1L12 17.8 5.8 21.2 7 14.1 2 9.3l7.1-.7z"/></svg></div>
    <div class="tarot-face tarot-front">${tarotCardSVG(i)}<div class="tn">${c.n}</div><div class="tr">${c.rev?'逆位':'正位'}</div></div>
  </div></div>`).join('');
  setTimeout(()=>tarotState.cards.forEach((_,i)=>flipTarot(i)),600);
}
function tarotCardSVG(i){
  const colors=['#c9a35c','#c98b8b','#7a9a5e','#7a9ab0','#9a7ac8','#d9954a'];
  const c=colors[i%colors.length];
  return `<svg viewBox="0 0 60 60" fill="none" stroke="${c}" stroke-width="2"><circle cx="30" cy="30" r="20"/><path d="M30 12v36M12 30h36"/><circle cx="30" cy="30" r="8" fill="${c}" fill-opacity=".2"/></svg>`;
}
function flipTarot(i){
  const el=document.getElementById('tc'+i); if(!el) return;
  el.classList.add('flipped');
  setTimeout(()=>renderTarotResults(),400);
}
function renderTarotResults(){
  const positions = tarotState.count===1?['現在']:['過去','現在','未來'];
  document.getElementById('tarotResults').innerHTML=tarotState.cards.map((c,i)=>`<div class="tarot-result-item">
    <div class="rt">${c.n} ${c.rev?'（逆位）':'（正位）'}</div>
    <div class="rp">${positions[i]}</div>
    <div class="rd">${c.rev?c.r:c.u}</div>
  </div>`).join('');
}

/* ================= 写信与收件匣 ================= */
function startLetterCheck(){
  if(letterCheckTimer) clearInterval(letterCheckTimer);
  letterCheckTimer=setInterval(()=>{ checkLetters(false); },60000);
  checkLetters(false);
}
function checkLettersOnHome(){ checkLetters(true); }
function checkLetters(showToast){
  loadLetters();
  let changed=false;
  const t=now();
  state.letters.forEach(l=>{
    if(!l.gotReply&&l.replyAt&&t>=l.replyAt){
      const data=getData(l.dreamId);
      const n=data.settings.letterSentences||30;
      const pool = getReplyPool(data);
      const cards=pool.length?pool:DEFAULT_CARDS;
      const lines=[]; for(let i=0;i<n;i++) lines.push(pick(cards));
      l.replyBody=lines.join('\n');
      l.gotReply=true; l.repliedAt=t; changed=true;
    }
  });
  if(changed) saveLetters();
  updateInboxBadge();
  if(showToast){
    const unread=state.letters.filter(l=>l.gotReply&&!l.read);
    if(unread.length){ showLetterToast(unread[0]); }
  }
}
function showLetterToast(letter){
  const old=document.getElementById('letterToast'); if(old) old.remove();
  const dream=getDream(letter.dreamId);
  const el=document.createElement('div'); el.id='letterToast';
  el.textContent=`${dream?dream.name:'夢角'} 回信了！點擊查看`;
  el.onclick=()=>{ el.remove(); openLetterDetail(letter.id); };
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),8000);
}
function openWriteLetter(){
  loadDreams();
  if(!state.dreams.length){ toast('請先建立夢角'); return; }
  openModal(`<h3>寫信</h3>
    <div class="modal-label">收信夢角</div>
    <select class="modal-input" id="letterTo">${state.dreams.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select>
    <div class="modal-label">信件內容（最多 800 字）</div>
    <textarea class="modal-input" id="letterBody" rows="6" maxlength="800" placeholder="寫下想說的話..." oninput="document.getElementById('letterCount').textContent=this.value.length+'/800'"></textarea>
    <div style="text-align:right;font-size:12px;color:var(--text-sub);" id="letterCount">0/800</div>
    <div class="modal-actions"><button onclick="closeModal()">取消</button><button class="primary" onclick="sendLetter()">寄出</button></div>`);
}
function sendLetter(){
  const dreamId=document.getElementById('letterTo').value;
  const body=document.getElementById('letterBody').value.trim();
  if(!body){ toast('請輸入內容'); return; }
  const dream=getDream(dreamId);
  const t=now();
  const letter={id:uid(),dreamId,fromName:state.profile.name||'訪客',toName:dream.name,body,sentAt:t,replyAt:t+randInt(8,12)*3600*1000,replyBody:'',gotReply:false,read:false,repliedAt:null};
  state.letters.push(letter); saveLetters();
  closeModal(); updateInboxBadge();
  toast('已寄出，靜候回信');
  startLetterCheck();
}
function openInbox(){
  loadLetters();
  const items=[...state.letters].sort((a,b)=>b.sentAt-a.sentAt);
  openModal(`<h3>收件匣</h3>
    ${items.length?items.map(l=>{
      const dream=getDream(l.dreamId);
      const status = !l.gotReply?'等待回信中':(l.read?'已讀':'新回信');
      return `<div class="letter-item" onclick="openLetterDetail('${l.id}')">
        <div class="li-top"><span class="li-title">${esc(dream?dream.name:'未知')}</span>${l.gotReply&&!l.read?'<span class="letter-unread-dot"></span>':''}</div>
        <div class="li-preview">${status} · ${esc(l.body.slice(0,30))}</div>
      </div>`;
    }).join(''):'<div class="lib-empty">還沒有信件</div>'}
    <div class="modal-actions"><button onclick="closeModal()">關閉</button></div>`);
}
function openLetterDetail(id){
  loadLetters();
  const l=state.letters.find(x=>x.id===id); if(!l) return;
  if(l.gotReply&&!l.read){ l.read=true; saveLetters(); updateInboxBadge(); }
  const dream=getDream(l.dreamId);
  const status = !l.gotReply?`等待回信中（預計 ${new Date(l.replyAt).toLocaleString()}）`: (l.read?'已讀':'新回信');
  openModal(`<h3>信件詳情</h3>
    <div class="letter-paper">
      <div class="letter-stamp">夢<br>郵</div>
      <div class="letter-head">${esc(l.fromName)} → ${esc(l.toName)}</div>
      <div class="letter-lines">${esc(l.body)}</div>
    </div>
    ${l.gotReply?`<div class="letter-paper"><div class="letter-head">${esc(l.toName)} 的回信</div><div class="letter-lines">${esc(l.replyBody)}</div></div>`:`<div style="text-align:center;color:var(--text-sub);font-size:13px;margin-bottom:10px;">${status}</div>`}
    <div class="modal-actions"><button onclick="closeModal()">關閉</button></div>`);
}
